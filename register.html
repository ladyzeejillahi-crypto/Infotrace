<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - InfoTrace</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>InfoTrace</h1>
        <p>Create Your Research Account</p>
    </header>

    <main>

        <section class="dashboard">

            <h2>Create an Account</h2>

            <p class="intro">
                Register to securely manage your research information.
            </p>

            <form id="registerForm">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

                <br><br>

                <button
                    type="submit"
                    class="main-button"
                >
                    Create Account
                </button>

            </form>

            <br>

            <p>
                Already have an account?
                <a href="login.html">
                    Login here
                </a>
            </p>

        </section>

    </main>

    <script>

        const registerForm =
            document.getElementById("registerForm");

        registerForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;


                if (password !== confirmPassword) {

                    alert("Passwords do not match.");

                    return;
                }


                const existingUser =
                    JSON.parse(
                        localStorage.getItem("infoTraceUser")
                    );


                if (
                    existingUser &&
                    existingUser.email === email
                ) {

                    alert(
                        "An account with this email already exists."
                    );

                    return;
                }


                const user = {

                    name: name,

                    email: email,

                    password: password

                };


                localStorage.setItem(
                    "infoTraceUser",
                    JSON.stringify(user)
                );


                alert(
                    "Account created successfully!"
                );


                window.location.href =
                    "login.html";

            }
        );

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Information - InfoTrace</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>InfoTrace</h1>

        <p>Search Your Information</p>

    </header>


    <main>

        <section class="dashboard">

            <h2>Search Information</h2>

            <p class="intro">
                Search through the information you have saved.
            </p>


            <input
                type="text"
                id="searchBox"
                placeholder="Search by title, source, keyword..."
                oninput="performSearch()"
            >


            <div id="searchResults">

                <p>
                    Type something above to search your saved information.
                </p>

            </div>


            <br>


            <a
                href="dashboard.html"
                class="start-button"
            >
                ← Back to Dashboard
            </a>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
